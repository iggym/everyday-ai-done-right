<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATS Resume Impact Statement Engine — Everyday AI Done Right</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAFAF9;
      --text: #1C1C1E;
      --text-muted: #6E6E73;
      --card-bg: #FFFFFF;
      --card-border: #E5E5E7;
      --green: #0F8A5F;
      --green-light: #E8F5E9;
      --coral: #FF6B4A;
      --coral-light: #FFF0ED;
      --code-bg: #282C34;
      --code-text: #ABB2BF;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      --radius: 16px;
      --font-heading: 'Manrope', -apple-system, sans-serif;
      --font-body: 'Inter', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="dark"] {
      --bg: #141414;
      --text: #F4F4F3;
      --text-muted: #989899;
      --card-bg: #1E1E20;
      --card-border: #2C2C2E;
      --green: #22C58B;
      --green-light: rgba(34, 197, 139, 0.15);
      --coral: #FF8064;
      --coral-light: rgba(255, 128, 100, 0.15);
      --code-bg: #0F0F10;
      --code-text: #E4E4E7;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.6;
      padding-bottom: 80px;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>

</html>
